<style>

}

  :root:not([data-theme="light"]) {
    --dg-bg: #0c1b22; --dg-fill: #132a35; --dg-stroke: #9fb3bb; --dg-reg: #16304a; --dg-logic: #142630; --dg-block: #33281a; --dg-clk: #b794f6; --dg-bad: #ff7b6b; --dg-badfill: #3a1a17; --dg-good: #5ad08a; --dg-goodfill: #12301f;
    --bg: #0a161d; --panel: #0f2029; --text: #e6ecea; --muted: #93a5ac; --line: #22343e; --soft: #15272f;
    --accent: #e8642c; --accent-ink: #ffffff; --accent-soft: #3a1e12; --label: #ff9b6b;
    --code-bg: #0f2029; --gutter: #0c1b22;
    --wave-bg: #0f2029; --wave-row: #122530; --wave-grid: #1b2f39; --wave: #4fd1a5; --wave-bus: #143a33; --wave-x: #ff7a6b; --wave-xfill: #3d1c18; --wave-z: #e0c25a;

  }
}
:root[data-theme="dark"] {
  --dg-bg: #0c1b22; --dg-fill: #132a35; --dg-stroke: #9fb3bb; --dg-reg: #16304a; --dg-logic: #142630; --dg-block: #33281a; --dg-clk: #b794f6; --dg-bad: #ff7b6b; --dg-badfill: #3a1a17; --dg-good: #5ad08a; --dg-goodfill: #12301f;
  --bg: #0a161d; --panel: #0f2029; --text: #e6ecea; --muted: #93a5ac; --line: #22343e; --soft: #15272f;
  --accent: #e8642c; --accent-ink: #ffffff; --accent-soft: #3a1e12; --label: #ff9b6b;

  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 Inter, system-ui, sans-serif; }
a { color: inherit; }
button, select, input { font: inherit; color: inherit; }
.mono, code, .ln, .CodeMirror { font-family: "JetBrains Mono", ui-monospace, monospace; }

/* header */
header.top { background: var(--navy); color: var(--navy-ink); }
.top-in { max-width: 1440px; margin: 0 auto; padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #fff; }
.brand b { font: 700 19px "Space Grotesk", sans-serif; letter-spacing: -0.01em; }
.brand span { font: 500 13px "JetBrains Mono", monospace; color: #ffb38a; }
.top nav { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 14px; }
.top nav a { text-decoration: none; color: #b9c6cb; padding: 8px 0; }
.top nav a:hover { color: #fff; }
.labs-nav { min-height: 47px; background: var(--panel); border-bottom: 1px solid var(--line); }
.labs-wrap { position: relative; max-width: 1440px; margin: 0 auto; }
.labs-in { padding: 0 20px; display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none; scroll-behavior: smooth; }
.labs-in::-webkit-scrollbar { display: none; }
.labs-nav a { text-decoration: none; color: var(--muted); font-weight: 600; font-size: 14px; padding: 13px 13px 11px; border-bottom: 3px solid transparent; white-space: nowrap; flex: none; }
.labs-nav a:hover { color: var(--text); }
.labs-arrow { position: absolute; top: 0; bottom: 3px; width: 44px; border: 0; padding: 0; z-index: 2; cursor: pointer; font-size: 22px; line-height: 1; color: var(--text); display: flex; align-items: center; }
.labs-arrow.l { left: 0; justify-content: flex-start; padding-left: 8px; background: linear-gradient(90deg, var(--panel) 45%, transparent); }
.labs-arrow.r { right: 0; justify-content: flex-end; padding-right: 8px; background: linear-gradient(270deg, var(--panel) 45%, transparent); }
.labs-wrap.at-start .labs-arrow.l, .labs-wrap.at-end .labs-arrow.r, .labs-wrap.fits .labs-arrow { opacity: 0; pointer-events: none; }
.labs-arrow { transition: opacity .15s; }
@media (hover: none) { .labs-arrow { font-size: 0; width: 28px; } }
.labs-nav a[aria-current="page"] { color: var(--text); border-bottom-color: var(--accent); }

.intro { max-width: 1440px; margin: 0 auto; padding: 22px 20px 6px; display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; justify-content: space-between; }
.intro h1 { margin: 0; font: 700 clamp(24px, 3vw, 32px)/1.15 "Space Grotesk", sans-serif; letter-spacing: -0.02em; }
.intro p { margin: 0; color: var(--muted); font-size: 14px; }

/* layout */
.app { max-width: 1440px; margin: 0 auto; padding: 14px 20px 40px; display: grid; grid-template-columns: 236px minmax(0, 1fr); gap: 18px; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } .side { display: none; } .ex-mobile { display: flex !important; } }

.side h2, .sec-label { font: 500 12px "JetBrains Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--label); margin: 4px 0 10px; }
.side .examples { display: flex; flex-direction: column; gap: 6px; }
.ex { text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; min-height: 44px; }
.ex:hover { border-color: var(--muted); }
.ex.active { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
.ex-tag { font: 500 11px "JetBrains Mono", monospace; color: var(--muted); }
.ex-title { font-weight: 600; font-size: 14px; }
.side .note { margin-top: 18px; font-size: 13px; color: var(--muted); }
.side .note a { color: var(--text); }

.main { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

/* toolbar */
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
.ex-mobile { display: none; align-items: center; gap: 8px; width: 100%; }
.ex-mobile select { flex: 1; min-width: 0; }
.field { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
select, input[type=text] { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; min-height: 40px; }
input[type=text] { width: 120px; font-family: "JetBrains Mono", monospace; font-size: 13px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 9px 14px; min-height: 40px; cursor: pointer; font-weight: 500; font-size: 14px; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--muted); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; padding: 9px 20px; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.hint-btn { border-color: var(--accent); color: var(--label); background: var(--accent-soft); font-weight: 600; }
.hint-box { border: 1px solid var(--accent); border-left-width: 4px; background: var(--accent-soft); border-radius: 8px; padding: 10px 14px 8px; margin: 0 0 12px; font-size: 14px; }
.hint-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.hint-x { border: 0; background: none; color: inherit; font-size: 20px; line-height: 1; cursor: pointer; padding: 0 4px; opacity: .7; }
.hint-x:hover { opacity: 1; }
.hint-step h4 { margin: 8px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--label); }
.hint-step ul { margin: 0 0 4px; padding-left: 20px; } .hint-step p { margin: 4px 0; }
.hint-note, .hint-foot { font-size: 12.5px; opacity: .8; } .hint-foot { margin: 8px 0 0; }
.hint-loc { font-size: 12px; font-weight: 600; margin: 8px 0 2px; opacity: .85; }
.hint-code { margin: 0; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font: 12.5px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre; }
.btn.small { min-height: 32px; padding: 5px 10px; font-size: 13px; }
.btn.ok { border-color: var(--ok); color: var(--ok); }
.spacer { flex: 1; }
.status { font: 500 13px "JetBrains Mono", monospace; padding: 6px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.status[data-kind="busy"] { color: var(--label); background: var(--accent-soft); }
.status[data-kind="ok"] { color: var(--ok); }
.status[data-kind="err"] { color: var(--err); }
@media (max-width: 640px) { .btn kbd { display: none; } }
kbd { font: 500 11px "JetBrains Mono", monospace; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .8; }

/* editors */
.editors { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 1100px) { .editors { grid-template-columns: minmax(0, 1fr); } }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.pane-head { display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.pane-head .fname { font: 500 13px "JetBrains Mono", monospace; }
.pane-head .role { font-size: 12px; color: var(--muted); }
.pane-body { height: 440px; }
.pane-body .CodeMirror { height: 100%; font-size: 13px; line-height: 1.55; background: var(--code-bg); color: var(--text); }
.CodeMirror-gutters { background: var(--gutter); border-right: 1px solid var(--line); }
.CodeMirror-linenumber { color: var(--muted); }
.CodeMirror-cursor { border-left-color: var(--text); }
.CodeMirror-selected, .CodeMirror-focused .CodeMirror-selected { background: var(--accent-soft) !important; }
.cm-keyword { color: #1d4ed8; font-weight: 500; } .cm-number { color: #0e7c66; } .cm-string { color: #a14000; } .cm-comment { color: #6b7a80; font-style: italic; } .cm-meta, .cm-def { color: #7c3aed; } .cm-builtin { color: #b42318; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .cm-keyword { color: #7aa2ff; } :root:not([data-theme="light"]) .cm-number { color: #4fd1a5; } :root:not([data-theme="light"]) .cm-string { color: #ffb38a; } :root:not([data-theme="light"]) .cm-comment { color: #7f939b; } :root:not([data-theme="light"]) .cm-meta, :root:not([data-theme="light"]) .cm-def { color: #c4a7ff; } :root:not([data-theme="light"]) .cm-builtin { color: #ff8a7a; } }
.cm-errline { background: var(--accent-soft); }
.plain-editor { width: 100%; height: 100%; border: 0; resize: none; padding: 12px; font: 13px/1.55 "JetBrains Mono", monospace; background: var(--code-bg); color: var(--text); tab-size: 2; }

/* output */
.out-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; }
#console { height: 230px; overflow: auto; padding: 10px 14px; font-size: 13px; line-height: 1.6; background: var(--code-bg); white-space: pre-wrap; word-break: break-word; }
.ln.meta { color: var(--muted); }
.ln.stderr { color: var(--text); }
.ln.err { color: var(--err); }
.ln.warn { color: var(--warn); }
.ln.pass { color: var(--ok); font-weight: 500; }
.loc { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font: inherit; }

.wave-wrap { overflow-x: hidden; overflow-y: auto; max-height: 520px; background: var(--wave-bg); }
#wave { display: block; cursor: crosshair; }
.wave-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.wave-meta { font: 12px "JetBrains Mono", monospace; color: var(--muted); }
#wave-values { font: 12px "JetBrains Mono", monospace; padding: 0 14px; }
#wave-values:not(:empty) { padding: 10px 14px; border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 2px 18px; }
.cur-time { grid-column: 1 / -1; color: var(--label); font-weight: 500; margin-bottom: 4px; }
.cur-row { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dashed var(--line); padding: 2px 0; }
.cur-row span:first-child { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.lab-tip { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent); border-radius: 10px; padding: 14px 16px; font-size: 14px; line-height: 1.55; }
.lab-tip[hidden] { display: none; }
.lab-tip-label { font: 500 11px "JetBrains Mono", monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--label); }
.lab-tip h3 { margin: 6px 0 8px; font: 700 16px/1.3 "Space Grotesk", sans-serif; }
.lab-tip-body p { margin: 0 0 8px; color: var(--text); }
.lab-tip-body pre { margin: 0 0 8px; padding: 8px 10px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: 12px/1.5 "JetBrains Mono", monospace; overflow-x: auto; }
.lab-tip-body code { font: 12.5px "JetBrains Mono", monospace; background: var(--soft); padding: 0 4px; border-radius: 3px; }
.lab-tip-body pre code { background: none; padding: 0; }
.lab-tip-body a, .lab-tip-foot a { color: var(--text); }
.lab-tip-foot { display: flex; align-items: center; gap: 12px; margin-top: 4px; font-size: 13px; }
.side .lab-tip { margin-top: 22px; }
.main-tip { display: none; }
@media (max-width: 900px) { .main-tip:not([hidden]) { display: block; } }
.video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; padding: 16px; }
.video-grid:empty { display: none; }
.video { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.video-thumb, .video-frame { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; border: 0; }
.video-thumb { position: relative; cursor: pointer; background: #0b1f2a center / cover no-repeat; display: flex; align-items: center; justify-content: center; padding: 0; }
.video-thumb:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.video-play { width: 56px; height: 56px; border-radius: 50%; background: var(--accent); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 10px rgba(0,0,0,.35); }
.video-thumb:hover .video-play { filter: brightness(1.1); }
.video-title { font-weight: 600; font-size: 14px; line-height: 1.4; color: var(--text); text-decoration: none; }
.video-title:hover { text-decoration: underline; }
.video-frame iframe, .vframe iframe { width: 100%; height: 100%; border: 0; border-radius: 8px; display: block; }
.vbadge { font-size: 13px; color: var(--muted); }
.vbadge.done { color: var(--label); font-weight: 600; }
.vbadge.prog { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--text); }
.vb-bar { flex: 0 0 90px; height: 6px; border-radius: 999px; background: var(--soft); overflow: hidden; } .vb-bar i { display: block; height: 100%; background: #e8642c; border-radius: 999px; transition: width .4s; }
.video-empty { margin: 0; padding: 16px; color: var(--muted); font-size: 14px; }
.video-empty a { color: var(--text); }
footer { max-width: 1440px; margin: 0 auto; padding: 0 20px 36px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; }
footer a { color: var(--muted); }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.sub-pop { position: fixed; right: 20px; bottom: 20px; z-index: 50; width: min(360px, calc(100vw - 32px)); background: var(--panel); color: var(--text); border: 1px solid var(--line); border-top: 3px solid #ff0033; border-radius: 12px; box-shadow: 0 12px 32px rgba(0,0,0,.22); padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; transform: translateY(12px); opacity: 0; transition: transform .25s, opacity .25s; }
.sub-pop.show { transform: none; opacity: 1; }
.sub-pop .sub-ic { flex: none; width: 40px; height: 40px; border-radius: 10px; background: #ff0033; display: grid; place-items: center; }
.sub-pop b { display: block; font: 700 16px/1.3 "Space Grotesk", sans-serif; margin-bottom: 3px; }
.sub-pop p { margin: 0 0 10px; font-size: 13px; line-height: 1.5; color: var(--muted); }
.sub-pop .sub-go { display: inline-flex; align-items: center; min-height: 36px; padding: 6px 14px; border-radius: 8px; background: #ff0033; color: #fff; font-weight: 600; font-size: 14px; text-decoration: none; }
.sub-pop .sub-x { position: absolute; top: 6px; right: 6px; border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; width: 36px; height: 36px; border-radius: 6px; cursor: pointer; }
.sub-pop .sub-x:hover { background: var(--soft); color: var(--text); }
@media (max-width: 640px) { .sub-pop { right: 16px; bottom: 16px; } }
.badge-pop { border-top-color: #e8642c; }
.badge-pop .sub-ic { background: #fbe9df; font-size: 22px; }
.badge-pop .sub-go { background: #e8642c; border: 0; cursor: pointer; font: inherit; font-weight: 600; font-size: 14px; }
.lab-brief[hidden] { display: none; }
.brief-body { display: grid; grid-template-columns: 1.3fr 1.2fr 1fr; gap: 18px 26px; padding: 16px 18px 18px; }
.brief-watch { margin: 14px 18px 0; padding: 10px 14px; border-radius: 10px; background: var(--accent-soft); display: grid; gap: 6px; }
.bw-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 14.5px; }
.bw-txt { flex: 1 1 260px; } .bw-txt a { color: var(--label); font-weight: 600; } .bw-min { color: var(--muted); }
.bw-play { border: 0; border-radius: 8px; background: #e8642c; color: #fff; font: inherit; font-weight: 600; padding: 6px 12px; min-height: 34px; cursor: pointer; }
.bw-play:hover { background: #d0541f; } .bw-player { max-width: 720px; }
.brief-col h3 { margin: 0 0 6px; font: 600 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--label); }
.brief-col p { margin: 0; font-size: 14px; line-height: 1.55; }
.brief-tasks { margin: 0; padding-left: 20px; font-size: 14px; line-height: 1.55; display: flex; flex-direction: column; gap: 4px; }
.brief-learn { font-weight: 500; }
.brief-fig { margin: 0; padding: 0 18px 18px; }
.brief-imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
.brief-imgs img { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.brief-html { margin-top: 14px; overflow-x: auto; font-size: 13px; }
.brief-html table { border-collapse: collapse; width: 100%; min-width: 640px; }
.brief-html th { background: #1f3f8a; color: #fff; font-weight: 600; text-align: left; padding: 6px 8px; }
.brief-html td { border-bottom: 1px solid var(--line); padding: 5px 8px; vertical-align: top; }
.brief-html td.n, .brief-html th.n { text-align: right; white-space: nowrap; }
.brief-html h4 { margin: 14px 0 6px; font-size: 14px; }
.brief-html ul { margin: 0; padding-left: 20px; line-height: 1.6; }
@media (max-width: 700px) { .brief-imgs { grid-template-columns: 1fr; } }
.brief-fig figcaption { margin-top: 8px; font-size: 13px; color: var(--muted); }
.brief-dg { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 14px 22px; padding: 0 18px 18px; align-items: start; }
.brief-dg.one { grid-template-columns: 1fr; }
.brief-dgp h3 { margin: 0 0 8px; font: 600 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .06em; color: var(--label); }
.brief-dgs { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--dg-bg); padding: 6px; }
.dg { display: block; width: 100%; height: auto; margin: 0 auto; font-family: Inter, system-ui, sans-serif; }

<script>
(async function () {
  const box = document.getElementById("tips");
  let md = "";
  try { const r = await fetch("tips.md", { cache: "no-cache" }); if (r.ok) md = await r.text(); } catch (_) {}
  md = md.replace(/<!--[\s\S]*?-->/g, "");
  // Each tip starts with a "## Title" line. An optional "Topic: ..." line follows.
  const tips = [];
  for (const part of md.split(/^## /m).slice(1)) {
    const lines = part.split("\n");
    const title = lines.shift().trim();
    let topic = "";
    while (lines.length && !lines[0].trim()) lines.shift();
    const m = /^topic:\s*(.+)$/i.exec((lines[0] || "").trim());
    if (m) { topic = m[1].trim(); lines.shift(); }
    const body = lines.join("\n").trim();
    if (title) tips.push({ title, topic, body, id: title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") });
  }
  if (!tips.length) {
    box.innerHTML = '<div class="empty"><b>The first tips are on the way</b>Check back soon, or follow the <a href="https://www.youtube.com/@vlsideepdive">YouTube channel</a>.</div>';
    return;
  }
  const render = (text) => (window.marked ? window.marked.parse(text) : text.split(/\n{2,}/).map((p) => "<p>" + p.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])) + "</p>").join(""));
  for (const t of tips) {
    const el = document.createElement("article");
    el.className = "tip"; el.id = t.id; el.dataset.topic = t.topic; el.dataset.text = (t.title + " " + t.topic + " " + t.body).toLowerCase();
    const a = document.createElement("a"); a.className = "anchor"; a.href = "#" + t.id; a.textContent = "Link"; a.setAttribute("aria-label", "Link to this tip");
    const h = document.createElement("h2"); h.textContent = t.title;
    el.append(a, h);
    if (t.topic) { const s = document.createElement("span"); s.className = "topic"; s.textContent = "// " + t.topic; el.appendChild(s); }
    const b = document.createElement("div"); b.className = "body"; b.innerHTML = render(t.body); el.appendChild(b);
    box.appendChild(el);
  }
  const topics = [...new Set(tips.map((t) => t.topic).filter(Boolean))];
  const search = document.getElementById("search");
  let active = "";
  const apply = () => {
    const q = search.value.trim().toLowerCase();
    for (const el of box.children) el.hidden = (active && el.dataset.topic !== active) || (q && !el.dataset.text.includes(q));
  };
  if (tips.length > 3) { search.hidden = false; search.addEventListener("input", apply); }
  if (topics.length > 1) {
    const f = document.getElementById("filters");
    for (const name of ["All", ...topics]) {
      const b = document.createElement("button"); b.type = "button"; b.className = "filter"; b.textContent = name;
      b.setAttribute("aria-pressed", name === "All" ? "true" : "false");
      b.addEventListener("click", () => { active = name === "All" ? "" : name; f.querySelectorAll(".filter").forEach((x) => x.setAttribute("aria-pressed", x === b ? "true" : "false")); apply(); });
      f.appendChild(b);
    }
  }
  if (location.hash) { const t = document.getElementById(location.hash.slice(1)); if (t) t.scrollIntoView(); }
})();
</script>
