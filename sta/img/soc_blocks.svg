<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" font-family="Inter, Arial, sans-serif" font-size="15">
  <title>Workshop SoC block diagram</title>
  <rect x="0" y="0" width="760" height="560" fill="#ffffff"/>
  <rect x="40" y="10" width="700" height="500" rx="6" fill="#4a90d9"/>
  <g stroke="#0d2747" stroke-width="3" fill="none">
    <line x1="215" y1="40" x2="215" y2="470"/>
    <line x1="160" y1="45" x2="270" y2="45"/><line x1="160" y1="115" x2="270" y2="115"/>
    <line x1="160" y1="185" x2="270" y2="185"/><line x1="160" y1="255" x2="270" y2="255"/>
    <line x1="160" y1="325" x2="215" y2="325"/><line x1="160" y1="465" x2="215" y2="465"/>
    <line x1="215" y1="290" x2="420" y2="290"/>
    <line x1="560" y1="230" x2="560" y2="270"/><line x1="560" y1="310" x2="560" y2="350"/>
    <line x1="560" y1="400" x2="560" y2="530"/>
    <line x1="10" y1="45" x2="70" y2="45"/><line x1="10" y1="185" x2="70" y2="185"/><line x1="10" y1="255" x2="40" y2="255"/>
    <line x1="115" y1="350" x2="115" y2="380" stroke-width="4"/><line x1="115" y1="490" x2="115" y2="540"/>
  </g>
  <g fill="#0d2747"><circle cx="10" cy="45" r="4"/><circle cx="10" cy="185" r="4"/><circle cx="10" cy="255" r="4"/><circle cx="115" cy="540" r="4"/></g>
  <g fill="#fde9a9" stroke="#c9a74a">
    <rect x="70" y="20" width="90" height="50" rx="3"/><rect x="70" y="90" width="90" height="50" rx="3"/>
    <rect x="70" y="160" width="90" height="50" rx="3"/><rect x="70" y="230" width="90" height="50" rx="3"/>
    <rect x="70" y="300" width="90" height="50" rx="3"/><rect x="70" y="440" width="90" height="50" rx="3"/>
    <rect x="270" y="20" width="100" height="50" rx="3"/><rect x="270" y="90" width="100" height="50" rx="3"/>
    <rect x="270" y="160" width="100" height="50" rx="3"/><rect x="270" y="230" width="100" height="50" rx="3"/>
    <rect x="420" y="270" width="280" height="40" rx="3"/><rect x="470" y="350" width="180" height="50" rx="3"/>
  </g>
  <rect x="70" y="380" width="90" height="40" rx="3" fill="#f6c9a8" stroke="#c9a74a"/>
  <rect x="40" y="241" width="24" height="28" fill="#d9f2e4" stroke="#0d2747"/>
  <rect x="410" y="20" width="310" height="210" rx="4" fill="#5aa832"/>
  <rect x="420" y="30" width="140" height="120" fill="#8fb0e3"/><rect x="570" y="30" width="140" height="120" fill="#8fb0e3"/>
  <rect x="440" y="95" width="100" height="36" fill="#fde9a9"/><rect x="590" y="95" width="100" height="36" fill="#fde9a9"/>
  <rect x="420" y="160" width="290" height="60" fill="#fde9a9"/>
  <rect x="510" y="530" width="100" height="16" fill="#111"/>
  <g fill="#0d2747" text-anchor="middle">
    <text x="115" y="42">MISC Logic</text><text x="115" y="58" font-size="11.5">(GPIO, I2C, etc.)</text>
    <text x="115" y="120">DMA</text><text x="115" y="190">JTAG</text><text x="115" y="260">PCIe</text>
    <text x="115" y="321">Efuse</text><text x="115" y="337">Controller</text>
    <text x="115" y="405">Efuse</text>
    <text x="115" y="461">Flash</text><text x="115" y="477">Controller</text>
    <text x="320" y="50">LDPC</text><text x="320" y="120">AES</text><text x="320" y="190">Accelerator</text>
    <text x="320" y="251">Comp/Decomp</text><text x="320" y="267">Engine</text>
    <text x="560" y="295" font-weight="700">Crossbar</text>
    <text x="560" y="380">DDR Memory Controller</text>
    <text x="490" y="118" font-size="13">64KB L1 Cache</text><text x="640" y="118" font-size="13">64KB L1 Cache</text>
