name: Latest YouTube videos

on:
  schedule:
    - cron: "23 * * * *"   # every hour
  workflow_dispatch:
  push:                     # also run when this job itself changes
    branches: [main]
    paths: [".github/scripts/latest_videos.py", ".github/workflows/latest-videos.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the 3 latest videos and the channel video count
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python .github/scripts/latest_videos.py
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain latest-videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add latest-videos.json
            git commit -m "Update latest YouTube videos"
            git push
          fi
